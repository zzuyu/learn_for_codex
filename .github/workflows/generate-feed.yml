name: Publish Digest Site

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-feed.yml'
      - 'config/**'
      - 'scripts/**'
      - 'feed-*.json'
      - 'state-feed.json'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Prepare digest payload
        working-directory: scripts
        run: |
          mkdir -p ../tmp
          node prepare-digest.js > ../tmp/prepared.json

      - name: Publish docs artifacts
        working-directory: scripts
        run: |
          node publish-site.js \
            --input ../tmp/prepared.json \
            --docs-root ../docs \
            --base-url "https://cdn.jsdelivr.net/gh/zzuyu/learn_for_codex@main/docs/" \
            > ../tmp/publish.json
          cat ../tmp/publish.json

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: publish digest [skip ci]"
          git push
